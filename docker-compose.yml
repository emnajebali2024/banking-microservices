name: banking-microservices

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 5 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - banking-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - banking-network

  account-service:
    build:
      context: ./account-service
      additional_contexts:
        proto: ./proto
    container_name: account-service
    restart: unless-stopped
    environment:
      DB_PATH: /data/accounts.db
    volumes:
      - account-data:/data
    networks:
      - banking-network

  transaction-service:
    build:
      context: ./transaction-service
      additional_contexts:
        proto: ./proto
    container_name: transaction-service
    restart: unless-stopped
    environment:
      DB_PATH: /data/transactions.db
      KAFKA_BROKERS: kafka:29092
    volumes:
      - transaction-data:/data
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - banking-network

  notification-service:
    build:
      context: ./notification-service
      additional_contexts:
        proto: ./proto
    container_name: notification-service
    restart: unless-stopped
    environment:
      DATA_PATH: /data/notifications-data.json
      KAFKA_BROKERS: kafka:29092
    volumes:
      - notification-data:/data
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - banking-network

  api-gateway:
    build:
      context: ./api-gateway
      additional_contexts:
        proto: ./proto
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ACCOUNT_SERVICE_ADDR: account-service:50051
      TRANSACTION_SERVICE_ADDR: transaction-service:50052
      NOTIFICATION_SERVICE_ADDR: notification-service:50053
    depends_on:
      - account-service
      - transaction-service
      - notification-service
    networks:
      - banking-network

networks:
  banking-network:
    driver: bridge

volumes:
  account-data:
  transaction-data:
  notification-data: