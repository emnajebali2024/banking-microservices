syntax = "proto3";

package account;

service AccountService {
  rpc CreateAccount (CreateAccountRequest) returns (AccountResponse);
  rpc GetAccount (GetAccountRequest) returns (AccountResponse);
  rpc UpdateAccount (UpdateAccountRequest) returns (AccountResponse);
  rpc DeleteAccount (DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc GetAllAccounts (Empty) returns (AccountListResponse);
  rpc UpdateBalance (UpdateBalanceRequest) returns (AccountResponse);
}

message Empty {}

message CreateAccountRequest {
  string owner_name = 1;
  string email = 2;
  double initial_balance = 3;
  string account_type = 4;
}

message GetAccountRequest {
  string id = 1;
}

message UpdateAccountRequest {
  string id = 1;
  string owner_name = 2;
  string email = 3;
  string account_type = 4;
}

message UpdateBalanceRequest {
  string id = 1;
  double amount = 2;
}

message DeleteAccountRequest {
  string id = 1;
}

message DeleteAccountResponse {
  bool success = 1;
  string message = 2;
}

message AccountResponse {
  string id = 1;
  string owner_name = 2;
  string email = 3;
  double balance = 4;
  string account_type = 5;
  string created_at = 6;
  string status = 7;
}

message AccountListResponse {
  repeated AccountResponse accounts = 1;
}